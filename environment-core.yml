# Porosity + mineral-map demos only (no TensorFlow / SegmentEveryGrain / SAM).
# conda env create -f environment-core.yml
# conda activate pypetrograph
# pip install -e .

name: pypetrograph
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy>=1.24
  - pillow>=10
  - matplotlib>=3.7
  - scikit-learn>=1.3
  - scipy>=1.10
  - geopandas>=0.14
  - shapely>=2
  - rasterio>=1.3
  - affine>=2.4
  - joblib>=1.3
  - pandas>=2
  - lightgbm>=4
  - scikit-image>=0.22
  - pyqt>=5.15
  - jupyterlab
  - ipykernel
  - pip
