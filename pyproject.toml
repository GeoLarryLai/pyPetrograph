[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyPetrograph"
version = "0.1.1"
description = "A toolkit for semi-automated, ML-assisted thin-section petrography: porosity estimation, mineral counting, grain segmentation and micro-texture analysis"
readme = "README-PyPI.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Larry Syu-Heng Lai" }]
keywords = ["petrography", "thin-section", "mineralogy", "segmentation", "porosity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "pillow>=10",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "geopandas>=0.14",
    "shapely>=2",
    "rasterio>=1.3",
    "affine>=2.4",
    "joblib>=1.3",
    "pandas>=2",
    "lightgbm>=4",
    "scikit-image>=0.22",
    # legend OCR (notebook 4 and the app); pulls in onnxruntime and OpenCV (~220 MB).
    # No Python 3.13+ wheels yet; there the legend uses swatch_1..N names.
    "rapidocr_onnxruntime>=1.3; python_version < '3.13'",
    # browser app (pypetrograph-app), ~11 MB, no Qt
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
# SegmentEveryGrain (grain segmentation, brings TensorFlow, PyTorch and SAM 2) is optional and is
# installed with its own instructions: https://github.com/zsylvester/segmenteverygrain
xgb = ["xgboost>=2"]
# notebook pop-up windows only: pip install PySide6-Essentials (not an extra)
test = [
    "pytest>=7",
    "httpx>=0.24",
]
all = ["pyPetrograph[xgb]"]

[project.scripts]
pypetrograph-app = "pyPetrograph.webapp:main"
pypetrograph-web = "pyPetrograph.webapp:main"

[project.urls]
Homepage = "https://github.com/GeoLarryLai/pyPetrograph"
Repository = "https://github.com/GeoLarryLai/pyPetrograph"
Changelog = "https://github.com/GeoLarryLai/pyPetrograph/blob/main/CHANGELOG.md"

[tool.setuptools.package-data]
"pyPetrograph.webapp" = ["static/*"]
"pyPetrograph.webapp.shell" = ["static/*"]

[tool.setuptools.packages.find]
include = ["pyPetrograph*"]

[tool.pytest.ini_options]
testpaths = ["pyPetrograph"]
norecursedirs = ["segmenteverygrain-main", "old codes", "_archive", "models", "dataset", "outputs", "dist", "AMICS data", "AMICS data-grain size analysis", "Rich Kyle-BEG Aggregate Mapping Project", "*.egg-info", ".*"]
