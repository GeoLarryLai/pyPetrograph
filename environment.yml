# Core env for the demos and the desktop app. SegmentEveryGrain is optional — see README.
# conda env create -f environment.yml            (or: -n <your-env> to use any env name)
# conda activate pypetrograph                    (or your own name)
# pip install -e .
# The name below is only a default; change it freely.

name: pypetrograph
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy>=1.24
  - pillow>=10
  - matplotlib>=3.7
  - scikit-learn>=1.3
  - scipy>=1.10
  - geopandas>=0.14
  - shapely>=2
  - rasterio>=1.3
  - affine>=2.4
  - joblib>=1.3
  - pandas>=2
  - lightgbm>=4
  - scikit-image>=0.22
  - pyqt>=5.15
  - pyside6>=6.6          # desktop app (pypetrograph-app)
  - xgboost>=2
  - jupyterlab
  - ipykernel
  - pip
  - pip:
      - rapidocr_onnxruntime>=1.3   # legend OCR (notebook 4 and the app; pulls in onnxruntime)
      - pytest>=7                   # tests only
      - pytest-qt>=4.2              # tests only (app GUI tests)
