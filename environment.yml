# Dev convenience only (conda env for running the notebooks and tests from a clone).
# pyproject.toml is the source of truth; users install with pip (see README).
# SegmentEveryGrain is optional and installed with its own instructions:
# https://github.com/zsylvester/segmenteverygrain
#   conda env create -f environment.yml && conda activate pypetrograph && pip install -e ".[test]"

name: pypetrograph
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy>=1.24
  - pillow>=10
  - matplotlib>=3.7
  - scikit-learn>=1.3
  - scipy>=1.10
  - geopandas>=0.14
  - shapely>=2
  - rasterio>=1.3
  - affine>=2.4
  - joblib>=1.3
  - pandas>=2
  - lightgbm>=4
  - scikit-image>=0.22
  - fastapi>=0.110             # browser app (pypetrograph-app)
  - uvicorn>=0.27
  - xgboost>=2                 # optional [xgb]
  - pytest>=7                  # tests only
  - httpx>=0.24                # tests only (FastAPI TestClient)
  - jupyterlab
  - ipykernel
  - pip
  - pip:
      - rapidocr_onnxruntime>=1.3   # legend OCR (base dependency; pulls in onnxruntime and OpenCV)
      - PySide6-Essentials>=6.6     # notebook pop-up windows only, ~250 MB
